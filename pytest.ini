[pytest]
testpaths = engine/tests backend/tests
pythonpath = engine/tests
addopts = -ra --strict-markers --import-mode=importlib
markers =
    integration: needs PostgreSQL (TEST_DATABASE_URL); skipped when it is unset
filterwarnings =
    # Third-party: FastAPI TestClient still wraps httpx; harmless until Starlette drops it.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
