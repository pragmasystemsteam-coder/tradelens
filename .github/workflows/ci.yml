# TradeLens CI: backend + engine quality gates and tests (incl. PostgreSQL), both Next.js apps,
# and the Compose file and images. Only throwaway placeholder values; no real secrets.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend + engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradelens_owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tradelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradelens_owner -d tradelens_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tradelens_owner:ci-only@localhost:5432/tradelens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]" -e "backend[dev]"
      - name: Roles and extensions (same script as deploy/postgres-init)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-only
          POSTGRES_USER: tradelens_owner
          POSTGRES_DB: tradelens_test
          APP_DB_USER: tradelens_app
          APP_DB_PASSWORD: ci-only
        run: sh deploy/postgres-init/01-roles.sh
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: |
          mypy --config-file engine/pyproject.toml engine/src
          mypy --config-file backend/pyproject.toml backend/src
      - name: Import contracts
        run: |
          lint-imports --config backend/pyproject.toml
          lint-imports --config engine/pyproject.toml
      - name: Tests (unit + PostgreSQL integration)
        run: python -m pytest

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: compose config + images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder .env from the example
        run: cp deploy/.env.example deploy/.env
      - name: Compose config
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env build api web admin-web
